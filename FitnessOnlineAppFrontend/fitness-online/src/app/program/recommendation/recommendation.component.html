<app-menu></app-menu>

<mat-accordion *ngFor="let predlog of predlozi" id="predlozi-kontejner">
    <mat-expansion-panel hideToggle>
        <mat-expansion-panel-header>
            <p class="ime">
                {{predlog.name}}
            </p>
            <p class="tezina">
                {{predlog.difficulty}}
            </p>
            <mat-icon>menu_book</mat-icon>
        </mat-expansion-panel-header>
        <p class="instrukcije">{{predlog.instructions}}</p>
    </mat-expansion-panel>
</mat-accordion>
